<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Yai's Money</title>
<style>
:root{--bg:#fff;--card:#fff;--text:#000;--muted:#3d3d3d;--good:#075b2b;--bad:#8b0000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:900px;min-height:100vh;margin:auto;padding:34px 26px 46px}.screen{display:none}.screen.active{display:block}
header{text-align:center;margin-bottom:28px}.brand{font-size:34px;font-weight:900}.label{margin-top:36px;font-size:25px;font-weight:900;letter-spacing:.04em}.balance{margin:14px 0 8px;font-size:clamp(58px,11vw,100px);font-weight:900;line-height:1.05;letter-spacing:-.04em}.updated{min-height:24px;color:var(--muted);font-size:20px;font-weight:700}
.actions,.month{display:grid;grid-template-columns:1fr 1fr;gap:18px}.actions{margin:38px 0 30px}button,input{font:inherit}.bigbtn,.back,.login-btn{min-height:110px;padding:18px;border:4px solid #000;border-radius:20px;background:#f2f2f2;color:#000;font-size:26px;font-weight:850;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08)}.bigbtn:active,.back:active,.login-btn:active{transform:translateY(2px);box-shadow:none}
.stat{padding:24px;border:3px solid #000;border-radius:18px;background:var(--card);text-align:center}.stat-title{font-size:20px;font-weight:900}.stat-value{margin-top:10px;font-size:34px;font-weight:900}.good{color:var(--good)}.bad{color:var(--bad)}
.screen-title{margin:14px 0 26px;text-align:center;font-size:36px;font-weight:900}.list{display:flex;flex-direction:column;gap:12px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:20px 22px;border:3px solid #000;border-radius:18px;background:var(--card)}.desc{font-size:25px;font-weight:800}.meta{margin-top:6px;color:var(--muted);font-size:19px;font-weight:700}.amount{text-align:right;font-size:28px;font-weight:900}.back{width:100%;min-height:90px;margin-top:26px}.notice{text-align:center;padding:22px;color:var(--muted);font-size:19px}.error{display:none;margin-top:18px;padding:14px 18px;border:2px solid #8b0000;border-radius:14px;background:#fff3f1;color:#8b0000;text-align:center;font-size:18px;font-weight:700}
.login-card{max-width:600px;margin:8vh auto 0;padding:42px 30px;border:4px solid #000;border-radius:24px;text-align:center}.login-title{font-size:36px;font-weight:900;margin-bottom:16px}.login-copy{font-size:22px;font-weight:700;line-height:1.35;margin:0 0 30px}.login-input{width:100%;min-height:78px;padding:15px 18px;border:3px solid #000;border-radius:16px;text-align:center;font-size:28px;font-weight:800}.login-btn{width:100%;min-height:90px;margin-top:20px}.login-error{display:none;margin-top:18px;color:#8b0000;font-size:19px;font-weight:800}
@media(max-width:600px){.app{padding:25px 18px 36px}.actions,.month{grid-template-columns:1fr}.balance{font-size:64px}.bigbtn{min-height:95px}.screen-title{font-size:32px}.desc{font-size:23px}.amount{font-size:25px}.login-card{margin-top:4vh;padding:34px 22px}.login-title{font-size:32px}.login-copy{font-size:20px}}
</style>
</head>
<body>
<main class="app">
<section id="login" class="screen active">
  <div class="login-card">
    <div class="brand">Yai's Money</div>
    <div class="login-title">Welcome</div>
    <p class="login-copy">Enter the family access code to see the balance.</p>
    <input id="accessCode" class="login-input" type="password" inputmode="text" autocomplete="current-password" aria-label="Family access code">
    <button class="login-btn" onclick="unlockDashboard()">OPEN MY BALANCE</button>
    <div id="loginError" class="login-error">That access code is not correct.</div>
  </div>
</section>

<section id="home" class="screen">
  <header><div class="brand">Yai's Money</div></header>
  <div style="text-align:center">
    <div class="label">YOUR BALANCE</div>
    <div id="balance" class="balance">—</div>
    <div id="updated" class="updated">Loading latest balance…</div>
  </div>
  <div class="actions">
    <button class="bigbtn" onclick="showScreen('charges')">SEE MY CHARGES</button>
    <button class="bigbtn" onclick="showScreen('deposits')">SEE MONEY IN</button>
  </div>
  <div class="month">
    <div class="stat"><div class="stat-title">MONEY IN THIS MONTH</div><div id="monthIn" class="stat-value good">—</div></div>
    <div class="stat"><div class="stat-title">SPENT THIS MONTH</div><div id="monthOut" class="stat-value bad">—</div></div>
  </div>
  <div id="error" class="error">Could not refresh right now. Showing the last information received.</div>
</section>

<section id="charges" class="screen">
  <div class="screen-title">My Charges</div>
  <div id="chargesList" class="list"></div>
  <button class="back" onclick="showScreen('home')">← BACK TO BALANCE</button>
</section>

<section id="deposits" class="screen">
  <div class="screen-title">Money In</div>
  <div id="depositsList" class="list"></div>
  <button class="back" onclick="showScreen('home')">← BACK TO BALANCE</button>
</section>
</main>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyL_k39cZsCap3joobdaPwe0EPVuH-h9EfIp6GDrkEICydZEGKpqFd6oHQzXhLfMVJ_/exec";
const ACCESS_KEY_NAME="yaiMoneyAccessCode";
let currentData=null;

function money(value){return new Intl.NumberFormat("en-US",{style:"currency",currency:"THB",minimumFractionDigits:0,maximumFractionDigits:2}).format(Number(value)||0)}
function showScreen(id){document.querySelectorAll(".screen").forEach(function(screen){screen.classList.remove("active")});document.getElementById(id).classList.add("active");window.scrollTo({top:0,behavior:"instant"})}
function renderRows(targetId,rows,type){
  const element=document.getElementById(targetId);element.innerHTML="";
  if(!rows||!rows.length){element.innerHTML='<div class="notice">Nothing to show.</div>';return}
  rows.forEach(function(item){
    const row=document.createElement("div");row.className="row";
    const left=document.createElement("div");
    const description=document.createElement("div");description.className="desc";description.textContent=item.description||"Transaction";
    const meta=document.createElement("div");meta.className="meta";meta.textContent=[item.date,item.category].filter(Boolean).join(" • ");
    left.append(description,meta);
    const amount=document.createElement("div");amount.className="amount "+(type==="in"?"good":"bad");amount.textContent=(type==="in"?"+ ":"− ")+money(item.amount);
    row.append(left,amount);element.appendChild(row);
  });
}
function render(data){
  currentData=data;
  document.getElementById("balance").textContent=money(data.balance);
  document.getElementById("monthIn").textContent=money(data.thisMonth&&data.thisMonth.moneyIn);
  document.getElementById("monthOut").textContent=money(data.thisMonth&&data.thisMonth.moneyOut);
  document.getElementById("updated").textContent="Updated "+(data.lastUpdated||"recently");
  renderRows("chargesList",data.recentCharges,"out");
  renderRows("depositsList",data.recentDeposits,"in");
  document.getElementById("error").style.display="none";
  try{localStorage.setItem("yaiMoneyLastData",JSON.stringify(data))}catch(e){}
}
function storedAccessCode(){try{return localStorage.getItem(ACCESS_KEY_NAME)||""}catch(e){return""}}
function showLogin(message){
  currentData=null;
  document.getElementById("accessCode").value="";
  document.getElementById("loginError").textContent=message||"That access code is not correct.";
  document.getElementById("loginError").style.display=message?"block":"none";
  showScreen("login");
  setTimeout(function(){document.getElementById("accessCode").focus()},100);
}
async function refresh(showLoginOnFailure){
  const code=storedAccessCode();
  if(!code){showLogin();return false}
  try{
    const url=API_URL+"?accessCode="+encodeURIComponent(code)+"&refresh="+Date.now();
    const response=await fetch(url,{cache:"no-store",redirect:"follow"});
    if(!response.ok)throw new Error("HTTP "+response.status);
    const data=await response.json();
    if(data.error){
      try{localStorage.removeItem(ACCESS_KEY_NAME)}catch(e){}
      if(showLoginOnFailure!==false)showLogin(data.message||"That access code is not correct.");
      return false;
    }
    render(data);
    return true;
  }catch(error){
    document.getElementById("error").style.display="block";
    if(!currentData){
      try{const saved=JSON.parse(localStorage.getItem("yaiMoneyLastData"));if(saved)render(saved)}catch(e){}
      document.getElementById("error").style.display="block";
      if(!currentData)document.getElementById("updated").textContent="Unable to load balance";
    }
    return false;
  }
}
async function unlockDashboard(){
  const code=document.getElementById("accessCode").value.trim();
  if(!code){document.getElementById("loginError").textContent="Please enter the family access code.";document.getElementById("loginError").style.display="block";return}
  try{localStorage.setItem(ACCESS_KEY_NAME,code)}catch(e){}
  const worked=await refresh(false);
  if(worked){showScreen("home")}else{showLogin("That access code is not correct.")}
}
document.getElementById("accessCode").addEventListener("keydown",function(event){if(event.key==="Enter")unlockDashboard()});
if(storedAccessCode()){showScreen("home");refresh(true)}else{showLogin()}
setInterval(function(){if(storedAccessCode()&&document.getElementById("home").classList.contains("active"))refresh(false)},5*60*1000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&storedAccessCode()&&document.getElementById("home").classList.contains("active"))refresh(false)});
</script>
</body>
</html>
