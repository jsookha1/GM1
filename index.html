<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<title>Yai's Money</title>
<style>
:root{--bg:#ffffff;--card:#ffffff;--text:#000000;--muted:#3d3d3d;--line:#000000;--good:#075b2b;--bad:#8b0000;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:900px;margin:auto;min-height:100vh;padding:34px 26px 46px}
header{text-align:center;margin-bottom:28px}
.brand{font-size:34px;font-weight:900}
.label{font-size:25px;font-weight:900;letter-spacing:.04em;margin-top:36px}
.balance{font-size:clamp(58px,11vw,100px);font-weight:900;line-height:1.05;margin:14px 0 8px;letter-spacing:-.04em}
.updated{font-size:20px;font-weight:700;color:#333;min-height:24px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:38px 0 30px}
button{font:inherit}
.bigbtn,.back{border:4px solid #000;background:#f2f2f2;color:#000;border-radius:20px;min-height:110px;font-size:26px;font-weight:850;padding:18px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.bigbtn:active,.back:active{transform:translateY(2px);box-shadow:none}
.month{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:24px;text-align:center}
.stat-title{font-size:20px;font-weight:900;color:#000}
.stat-value{font-size:34px;font-weight:900;margin-top:10px}
.good{color:var(--good)} .bad{color:var(--bad)}
.screen{display:none}.screen.active{display:block}
.screen-title{text-align:center;font-size:36px;font-weight:900;margin:14px 0 26px}
.list{display:flex;flex-direction:column;gap:12px}
.row{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:20px 22px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.desc{font-size:25px;font-weight:800}.meta{font-size:19px;font-weight:700;color:#333;margin-top:6px}
.amount{font-size:28px;font-weight:900;text-align:right}
.back{width:100%;margin-top:26px;min-height:90px}
.notice{text-align:center;font-size:19px;color:var(--muted);padding:22px}
.error{background:#fff3f1;border:1px solid #e3bbb5;border-radius:14px;padding:14px 18px;text-align:center;font-size:18px;margin-top:18px;display:none}
@media(max-width:600px){.app{padding:25px 18px 36px}.actions,.month{grid-template-columns:1fr}.balance{font-size:64px}.bigbtn{min-height:95px}.screen-title{font-size:32px}.desc{font-size:23px}.amount{font-size:25px}}
</style>
</head>
<body>
<main class="app">
<section id="home" class="screen active">
<header><div class="brand">Yai's Money</div></header>
<div style="text-align:center">
  <div class="label">YOUR BALANCE</div>
  <div id="balance" class="balance">—</div>
  <div id="updated" class="updated">Loading latest balance…</div>
</div>
<div class="actions">
  <button class="bigbtn" onclick="showScreen('charges')">SEE MY CHARGES</button>
  <button class="bigbtn" onclick="showScreen('deposits')">SEE MONEY IN</button>
</div>
<div class="month">
  <div class="stat"><div class="stat-title">MONEY IN THIS MONTH</div><div id="monthIn" class="stat-value good">—</div></div>
  <div class="stat"><div class="stat-title">SPENT THIS MONTH</div><div id="monthOut" class="stat-value bad">—</div></div>
</div>
<div id="error" class="error">Could not refresh right now. Showing the last information received.</div>
</section>
<section id="charges" class="screen">
  <div class="screen-title">My Charges</div>
  <div id="chargesList" class="list"></div>
  <button class="back" onclick="showScreen('home')">← BACK TO BALANCE</button>
</section>
<section id="deposits" class="screen">
  <div class="screen-title">Money In</div>
  <div id="depositsList" class="list"></div>
  <button class="back" onclick="showScreen('home')">← BACK TO BALANCE</button>
</section>
</main>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxJyC9BzqQ84ZDExSQpnUBceQId6CWLXIAdwnC6cFPxbJYZUn-gkD7JPbGtaA62avd5/exec";
let currentData = null;
function money(n){ return new Intl.NumberFormat('en-US',{style:'currency',currency:'THB',minimumFractionDigits:0,maximumFractionDigits:2}).format(Number(n)||0); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo({top:0,behavior:'instant'}); }
function renderRows(targetId, rows, type){
  const el=document.getElementById(targetId); el.innerHTML='';
  if(!rows || !rows.length){ el.innerHTML='<div class="notice">Nothing to show.</div>'; return; }
  rows.forEach(item=>{
    const row=document.createElement('div'); row.className='row';
    const left=document.createElement('div');
    const desc=document.createElement('div'); desc.className='desc'; desc.textContent=item.description || 'Transaction';
    const meta=document.createElement('div'); meta.className='meta'; meta.textContent=[item.date,item.category].filter(Boolean).join(' • ');
    left.append(desc,meta);
    const amount=document.createElement('div'); amount.className='amount '+(type==='in'?'good':'bad'); amount.textContent=(type==='in'?'+ ':'− ')+money(item.amount);
    row.append(left,amount); el.appendChild(row);
  });
}
function render(data){
  currentData=data;
  document.getElementById('balance').textContent=money(data.balance);
  document.getElementById('monthIn').textContent=money(data.thisMonth?.moneyIn);
  document.getElementById('monthOut').textContent=money(data.thisMonth?.moneyOut);
  document.getElementById('updated').textContent='Updated '+(data.lastUpdated || 'recently');
  renderRows('chargesList',data.recentCharges,'out');
  renderRows('depositsList',data.recentDeposits,'in');
  document.getElementById('error').style.display='none';
  try{localStorage.setItem('yaiMoneyLastData',JSON.stringify(data));}catch(e){}
}
async function refresh(){
  try{
    const separator=API_URL.includes('?')?'&':'?';
    const res=await fetch(API_URL+separator+'refresh='+Date.now(),{cache:'no-store',redirect:'follow'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(data.error) throw new Error(data.message || 'API error');
    render(data);
  }catch(err){
    document.getElementById('error').style.display='block';
    if(!currentData){
      try{ const saved=JSON.parse(localStorage.getItem('yaiMoneyLastData')); if(saved) render(saved); }catch(e){}
      document.getElementById('error').style.display='block';
      if(!currentData) document.getElementById('updated').textContent='Unable to load balance';
    }
  }
}
refresh();
setInterval(refresh, 5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden) refresh();});
</script>
</body>
</html>
